name: Analytics demo
on:
  push:
    paths: ['analytics/**', '.github/workflows/analytics-demo.yml']
  pull_request:
    paths: ['analytics/**', '.github/workflows/analytics-demo.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  demo:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip
          cache-dependency-path: analytics/requirements.txt
      - run: python -m pip install -r analytics/requirements.txt
      - run: python -B analytics/tools/build_demo.py
      - run: python -B analytics/bi/tests/test_dashboard.py
      - run: python -B analytics/tools/report_query.py --store analytics/demo/local comment_velocity 2026-11-03 2026-11-04
