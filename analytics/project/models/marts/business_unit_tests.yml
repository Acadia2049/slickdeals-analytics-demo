version: 2
unit_tests:
  - name: freeze_first_quote_and_first_snapshot
    model: mart_deal_first_observed
    description: "同日第二个快照已属新增；换店、变价和旧版不改首观察。"
    given:
      - input: ref('fct_deal_observation')
        rows:
          - {"deal_id":1,"snapshot_sequence":3,"run_key":"r3","merchant_id":"a","title":"old","title_link":"/old","deal_price_type":"other","deal_price_amount":null,"deal_price_raw":"v1","is_business_cohort":false,"price_parse_success":true,"raw_schema_version":1,"snapshot_timestamp":"2026-11-03 10:00:00"}
          - {"deal_id":1,"snapshot_sequence":8,"run_key":"r8","merchant_id":"a","title":"first","title_link":"/first","deal_price_type":"starting_at","deal_price_amount":8,"deal_price_raw":"from $8","is_business_cohort":true,"price_parse_success":true,"raw_schema_version":2,"snapshot_timestamp":"2026-11-03 08:00:00"}
          - {"deal_id":1,"snapshot_sequence":9,"run_key":"r9","merchant_id":"b","title":"changed","title_link":"/changed","deal_price_type":"fixed","deal_price_amount":50,"deal_price_raw":"$50","is_business_cohort":true,"price_parse_success":true,"raw_schema_version":2,"snapshot_timestamp":"2026-11-03 10:00:00"}
          - {"deal_id":2,"snapshot_sequence":9,"run_key":"r9","merchant_id":"b","title":"next","title_link":"/next","deal_price_type":"fixed","deal_price_amount":0,"deal_price_raw":"$0","is_business_cohort":true,"price_parse_success":true,"raw_schema_version":2,"snapshot_timestamp":"2026-11-03 10:00:00"}
          - {"deal_id":3,"snapshot_sequence":9,"run_key":"r9","merchant_id":"b","title":"ambiguous","title_link":"/ambiguous","deal_price_type":"fixed","deal_price_amount":2150,"deal_price_raw":"$21,50","is_business_cohort":true,"price_parse_success":true,"raw_schema_version":2,"snapshot_timestamp":"2026-11-03 10:00:00"}
          - {"deal_id":4,"snapshot_sequence":9,"run_key":"r9","merchant_id":"a","title":"free","title_link":"/free","deal_price_type":"free","deal_price_amount":0,"deal_price_raw":"Free","is_business_cohort":true,"price_parse_success":true,"raw_schema_version":2,"snapshot_timestamp":"2026-11-03 10:00:00"}
      - input: ref('int_snapshot_context')
        rows:
          - {"snapshot_sequence":3,"is_business_cohort":false}
          - {"snapshot_sequence":8,"is_business_cohort":true}
          - {"snapshot_sequence":9,"is_business_cohort":true}
    expect:
      rows:
        - {"deal_id":1,"first_merchant_id":"a","first_link":"/first","first_price_type":"starting_at","fixed_price_eligible":false,"is_baseline_deal":true,"seen_in_legacy":true}
        - {"deal_id":2,"first_merchant_id":"b","first_link":"/next","first_price_type":"fixed","fixed_price_eligible":true,"is_baseline_deal":false,"seen_in_legacy":false}
        - {"deal_id":3,"first_merchant_id":"b","first_link":"/ambiguous","first_price_type":"fixed","fixed_price_eligible":false,"is_baseline_deal":false,"seen_in_legacy":false}
        - {"deal_id":4,"first_merchant_id":"a","first_link":"/free","first_price_type":"free","fixed_price_eligible":false,"is_baseline_deal":false,"seen_in_legacy":false}
  - name: previous_members_survive_transfer_or_disappear
    model: mart_merchant_snapshot
    description: "A 的三个前端成员一个保留、一个转出、一个消失；B 的早期缺席为零。"
    given:
      - input: ref('fct_deal_observation')
        rows:
          - {"deal_id":1,"run_key":"p","merchant_id":"a","merchant_name":"a","is_business_cohort":true}
          - {"deal_id":2,"run_key":"p","merchant_id":"a","merchant_name":"a","is_business_cohort":true}
          - {"deal_id":3,"run_key":"p","merchant_id":"a","merchant_name":"a","is_business_cohort":true}
          - {"deal_id":1,"run_key":"q","merchant_id":"a","merchant_name":"a","is_business_cohort":true}
          - {"deal_id":2,"run_key":"q","merchant_id":"b","merchant_name":"b","is_business_cohort":true}
      - input: ref('int_snapshot_context')
        rows:
          - {"run_key":"p","snapshot_sequence":1,"is_business_cohort":true,"pair_eligible":false,"observation_rows":3}
          - {"run_key":"q","snapshot_sequence":2,"previous_global_run_key":"p","is_business_cohort":true,"pair_eligible":true,"observation_rows":2}
      - input: ref('mart_deal_first_observed')
        rows:
          - {"first_run_key":"p","first_merchant_id":"a","is_baseline_deal":true}
    expect:
      rows:
        - {"run_key":"p","merchant_id":"a","merchant_deals":3,"full_snapshot_deals":3,"previous_memberships":null,"retained_memberships":null,"transferred_out":null}
        - {"run_key":"p","merchant_id":"b","merchant_deals":0,"full_snapshot_deals":3,"previous_memberships":null,"retained_memberships":null,"transferred_out":null}
        - {"run_key":"q","merchant_id":"a","merchant_deals":1,"full_snapshot_deals":2,"previous_memberships":3,"retained_memberships":1,"transferred_out":1}
        - {"run_key":"q","merchant_id":"b","merchant_deals":1,"full_snapshot_deals":2,"previous_memberships":0,"retained_memberships":0,"transferred_out":0}
  - name: quality_warning_and_unknown_are_independent
    model: mart_collection_quality
    description: "质量展示保留原始已知与未知；缺少上游通过证据不能进入正式构建。"
    given:
      - input: ref('int_snapshot_context')
        rows:
          - {"run_key":"a","is_truncated":false,"volume_status":"warning"}
          - {"run_key":"b","is_truncated":true,"volume_status":"normal"}
          - {"run_key":"c","is_truncated":null,"volume_status":null}
    expect:
      rows:
        - {"run_key":"a","truncation_state":"complete","volume_state":"warning"}
        - {"run_key":"b","truncation_state":"truncated","volume_state":"normal"}
        - {"run_key":"c","truncation_state":"unknown","volume_state":"unknown"}
