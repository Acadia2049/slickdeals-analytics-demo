          - {"deal_id":5,"pair_eligible":false,"snapshot_steps":1,"observation_gap_hours":2,"audit_comment_delta":3,"merchant_changed_in_v2":false}
          - {"deal_id":6,"pair_eligible":true,"snapshot_steps":1,"observation_gap_hours":2,"audit_comment_delta":3,"merchant_changed_in_v2":true}
          - {"deal_id":7,"pair_eligible":false,"snapshot_steps":null,"observation_gap_hours":null,"audit_comment_delta":null,"merchant_changed_in_v2":false}
    expect:
      rows:
        - {"deal_id":1,"interval_eligible":true,"merchant_comparison_eligible":true,"comment_delta":-2,"eligible_comment_hours":2}
        - {"deal_id":2,"interval_eligible":true,"merchant_comparison_eligible":true,"comment_delta":0,"eligible_comment_hours":2}
