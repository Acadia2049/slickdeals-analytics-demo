  - name: lag_gaps_nulls_and_merchant_switch
    model: int_observation_history
    description: "时间轴先于商家和 cohort 切片，保留真实链接和负差值。"
    given:
      - input: ref('stg_clean_observation')
        rows:
          - {"snapshot_timestamp":"2026-11-03 00:00:00","deal_id":1,"store_normalized":"x","store":"x","comment_count":9,"title":"t0","title_link":"url0"}
          - {"snapshot_timestamp":"2026-11-03 02:00:00","deal_id":1,"store_normalized":"a","store":"a","comment_count":10,"title":"t1","title_link":"url1"}
          - {"snapshot_timestamp":"2026-11-03 03:30:00","deal_id":1,"store_normalized":"a","store":"a","comment_count":8,"title":"t2","title_link":"url2"}
          - {"snapshot_timestamp":"2026-11-03 06:00:00","deal_id":2,"store_normalized":"c","store":"c","comment_count":null,"title":"t3","title_link":"url3"}
          - {"snapshot_timestamp":"2026-11-03 08:30:01","deal_id":1,"store_normalized":"b","store":"b","comment_count":15,"title":"t4","title_link":"url4"}
          - {"snapshot_timestamp":"2026-11-03 08:30:01","deal_id":2,"store_normalized":"c","store":"c","comment_count":2,"title":"t4","title_link":"url4"}
      - input: ref('int_snapshot_context')
        rows:
          - {"snapshot_timestamp":"2026-11-03 00:00:00","run_key":"r0","snapshot_sequence":1,"is_business_cohort":false,"pair_eligible":false}
          - {"snapshot_timestamp":"2026-11-03 02:00:00","run_key":"r1","snapshot_sequence":2,"is_business_cohort":true,"pair_eligible":false}
          - {"snapshot_timestamp":"2026-11-03 03:30:00","run_key":"r2","snapshot_sequence":3,"is_business_cohort":true,"pair_eligible":true}
          - {"snapshot_timestamp":"2026-11-03 06:00:00","run_key":"r3","snapshot_sequence":4,"is_business_cohort":true,"pair_eligible":true}
          - {"snapshot_timestamp":"2026-11-03 08:30:01","run_key":"r4","snapshot_sequence":5,"is_business_cohort":true,"pair_eligible":true}
    expect:
      rows:
        - {"deal_id":1,"snapshot_sequence":1,"audit_comment_delta":null,"merchant_changed_in_v2":true,"previous_title_link":null,"observation_context":"first_observation"}
        - {"deal_id":1,"snapshot_sequence":2,"audit_comment_delta":1,"merchant_changed_in_v2":true,"previous_title_link":"url0","observation_context":"consecutive_snapshot"}
        - {"deal_id":1,"snapshot_sequence":3,"audit_comment_delta":-2,"merchant_changed_in_v2":true,"previous_title_link":"url1","observation_context":"consecutive_snapshot"}
        - {"deal_id":2,"snapshot_sequence":4,"audit_comment_delta":null,"merchant_changed_in_v2":false,"previous_title_link":null,"observation_context":"first_observation"}
        - {"deal_id":1,"snapshot_sequence":5,"audit_comment_delta":null,"merchant_changed_in_v2":true,"previous_title_link":"url2","observation_context":"reappeared_after_gap"}
        - {"deal_id":2,"snapshot_sequence":5,"audit_comment_delta":null,"merchant_changed_in_v2":false,"previous_title_link":"url3","observation_context":"consecutive_snapshot"}
  - name: business_delta_and_counter_exposure
    model: fct_deal_observation
    description: "缺失评论不贡献小时；零与负值保留；换店仅排除商家比较。"
    given:
      - input: ref('int_observation_history')
        rows:
          - {"deal_id":1,"pair_eligible":true,"snapshot_steps":1,"observation_gap_hours":2,"audit_comment_delta":-2,"merchant_changed_in_v2":false}
          - {"deal_id":2,"pair_eligible":true,"snapshot_steps":1,"observation_gap_hours":2,"audit_comment_delta":0,"merchant_changed_in_v2":false}
